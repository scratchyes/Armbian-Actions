# Rockchip RK3399 hexa core 4GB DDR3 SoC eMMC GBE USB3
BOARD_NAME="YZD"
BOARDFAMILY="rockchip64"
BOARD_MAINTAINER=""
BOOTCONFIG="yzd-rk3399_defconfig"
KERNEL_TARGET="current,edge"
MODULES="i2c_dev"
FULL_DESKTOP="yes"
BOOT_LOGO="desktop"
BOOT_FDT_FILE="rockchip/rk3399-yzd.dtb"
BOOT_SCENARIO="spl-blobs"
SRC_EXTLINUX="yes"
SRC_CMDLINE="console=ttyS2,1500000 console=tty0"
PACKAGE_LIST_BOARD="vim"

# Mainline U-Boot
function post_family_config_branch_current__yzd_use_mainline_uboot() {
	display_alert "$BOARD" "Using mainline U-Boot for $BOARD / $BRANCH" "info"

	declare -g BOOTSOURCE="https://github.com/u-boot/u-boot" # We ❤️ Mainline U-Boot
	declare -g BOOTBRANCH="tag:v2023.01"
	declare -g BOOTPATCHDIR="v2023.01"
}
